<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Monty Jack</title>

    <link rel="stylesheet" href="../css/site.css">
    <link rel="stylesheet" href="../css/gallery.css">
    <link rel="stylesheet" href="../css/lightbox.css">
</head>

<body>
    <header class="site-header">

    <a class="site-logo" href="/" aria-label="Monty Jack">
        <img src="/assets/site/montyjack.png" alt="Monty Jack">
    </a>


    <!-- Desktop navigation -->
    <nav class="site-nav" aria-label="Main navigation">

        <a href="/" aria-label="Home">
            <img src="/assets/site/home.png" alt="">
        </a>

        <a
            href="/gallery/"
            aria-label="Gallery"
            aria-current="page"
        >
            <img src="/assets/site/gallery.png" alt="">
        </a>

        <a href="/shop/" aria-label="Shop">
            <img src="/assets/site/shop.png" alt="">
        </a>

        <a href="/#contact" aria-label="Contact">
            <img src="/assets/site/contact.png" alt="">
        </a>

    </nav>


    <!-- Hamburger -->
    <button
        class="site-menu-toggle"
        id="site-menu-toggle"
        type="button"
        aria-label="Open navigation"
        aria-controls="site-menu"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

</header>


<!-- Collapsed navigation -->
<dialog
    class="site-menu"
    id="site-menu"
>
    <button
        class="site-menu-close"
        id="site-menu-close"
        type="button"
        aria-label="Close navigation"
    >
        &times;
    </button>


    <div class="site-menu-content">

        <nav
            class="site-menu-nav"
            aria-label="Collapsed navigation"
        >
            <a href="/" aria-label="Home">
                <img src="/assets/site/home.png" alt="">
            </a>

            <a
                href="/gallery/"
                aria-label="Gallery"
                aria-current="page"
            >
                <img src="/assets/site/gallery.png" alt="">
            </a>

            <a href="/shop/" aria-label="Shop">
                <img src="/assets/site/shop.png" alt="">
            </a>

            <a href="/#contact" aria-label="Contact">
                <img src="/assets/site/contact.png" alt="">
            </a>
        </nav>


        <div class="site-menu-socials">

            <a
                href="https://www.instagram.com/monty_jack0/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
            >
                <img
                    src="/assets/site/instagram.png"
                    alt=""
                >
            </a>

            <a
                href="mailto:hello@montyjack.com"
                aria-label="Email"
            >
                <img
                    src="/assets/site/email.png"
                    alt=""
                >
            </a>

        </div>

    </div>
</dialog>

    <main>

        <section class="gallery-page">

            <div class="gallery-notice">
                <h1>*Piece details not yet added while website is under development</h1>
            </div>
            <!-- Header for selecting filtered views -->
            <div class="gallery-header">
                <div class="gallery-filters" aria-label="Filter artwork">
                    <button class="filter-button active" data-filter="all" aria-pressed="true">
                        All
                    </button>
                    <button class="filter-button" data-filter="fine" aria-pressed="false">
                        Fine Art
                    </button>
                    <button class="filter-button" data-filter="3d" aria-pressed="false">
                        3D
                    </button>
                    <button class="filter-button" data-filter="digital" aria-pressed="false">
                        Digital
                    </button>
                    <button class="filter-button" data-filter="photo" aria-pressed="false">
                        Photography
                    </button>
                    <button class="filter-button" data-filter="misc" aria-pressed="false">
                        Misc.
                    </button>
                    <button class="filter-button" data-filter="sketch" aria-pressed="false">
                        Sketches
                    </button>
                </div>
            </div>

            <!-- Grid where gallery.js inserts pieces -->
            <div class="gallery-grid" id="gallery-grid"></div>

        </section>

    </main>

    <!-- Lightbox -->
    <div
        class="lightbox"
        id="lightbox"
        role="dialog"
        aria-modal="true"
        aria-label="Artpiece viewer"
        hidden=""
    >
        <!-- Close -->
        <button
            class="lightbox-close"
            id="lightbox-close"
            aria-label="Close artpiece viewer"
        >&times;</button>

        <!-- Previous piece -->
        <button
            class="piece-nav piece-nav-previous"
            id="piece-previous"
            aria-label="Previous artpiece"
        >&#10094;</button>

        <!-- Next piece -->
        <button
            class="piece-nav piece-nav-next"
            id="piece-next"
            aria-label="Next artpiece"
        >&#10095;</button>


        <div class="lightbox-content" id="lightbox-content">
            <div class="lightbox-viewer">
                <div class="lightbox-artwork">
                    <!-- Previous image of piece -->
                    <button
                        class="image-nav image-nav-previous"
                        id="image-previous"
                        aria-label="Previous image"
                    >&#10094;</button>

                    <!-- Image of piece -->
                    <img id="lightbox-image" src="" alt="">

                    <!-- Next image of piece -->
                    <button
                        class="image-nav image-nav-next"
                        id="image-next"
                        aria-label="Next image"
                    >&#10095;</button>
                </div>
                
                <div class="lightbox-controls">

                    <button
                    class="copy-link-button"
                    id="copy-link-button"
                    type="button"
                    >Copy Link</button>

                    <span class="image-index" id="image-index"></span>

                    <button
                        class="details-toggle"
                        id="details-toggle"
                        aria-expanded="false"
                        aria-controls="details-panel"
                    >Details</button>

                </div>
            </div>
        </div>

        <!-- Additional details panel -->
        <aside
            class="details-panel"
            id="details-panel"
            aria-hidden="true"
        >
            <button
                class="details-close"
                id="details-close"
                aria-label="Close artwork details"
            >&rarr;</button>

            <div class="details-content">
                <h2 id="details-title"></h2>
                <p class="details-date" id="details-date"></p>
    
                <div
                    class="details-meta-row"
                    id="details-materials-row"
                    hidden
                >
                    <span class="details-label">Materials</span>
                    <span id="details-materials"></span>
                </div>

                <div
                    class="details-meta-row"
                    id="details-dimensions-row"
                    hidden
                >
                    <span class="details-label">Dimensions</span>
                    <span id="details-dimensions"></span>
                </div>

                <div
                    class="details-description"
                    id="details-description-section"
                    hidden
                >
                    <p id="details-description"></p>
                </div>


                <div
                    class="details-venue"
                    id="details-venue-section"
                    hidden
                >
                    <span class="details-label">
                        Venues
                    </span>

                    <div id="details-venue"></div>
                </div>

                <div
                    class="details-shop"
                    id="details-shop-section"
                    hidden
                >
                    <span class="details-label">
                        View in Shop
                    </span>

                    <div id="details-shop"></div>
                </div>
            </div>
        </aside>

    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <img class="site-footer-art" src="/assets/site/footer.png" alt="">

        <div class="site-footer-content">
            <nav class="site-footer-socials" aria-label="Social media platforms">
                <a
                    href="https://www.instagram.com/monty_jack0/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                >
                    <img src="/assets/site/instagram-filled.png" alt="">
                </a>

                <a href="mailto:hello@montyjack.com" aria-label="Email">
                    <img src="/assets/site/email-filled.png" alt="">
                </a>              
            </nav>

            <p>&copy; 2026 Monty Jack</p>
        </div>
    </footer>

    <!-- TEMP DEV POPUP -->
<div
    class="development-popup"
    id="development-popup"
    role="dialog"
    aria-modal="true"
    aria-labelledby="development-popup-title"
>
    <div class="development-popup-content">

        <button
            class="development-popup-close"
            id="development-popup-close"
            type="button"
            aria-label="Close development notice"
        >
            &times;
        </button>

        <h2 id="development-popup-title">
            Site Under Development
        </h2>

        <p>
            This website is currently under development.
            Some pages, artwork information, and shop features
            may be incomplete or unavailable.
        </p>

        <button
            class="development-popup-continue"
            id="development-popup-continue"
            type="button"
        >
            Continue
        </button>

    </div>
</div>

    <script src="../js/site.js"></script>
    <script src="../js/pieces.js" defer></script>
    <script src="../js/lightbox.js" defer></script>
    <script src="../js/gallery.js" defer></script>

    <!-- Cloudflare Web Analytics -->
     <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a90dfcdf83304e1a97027aba6ba4aad4"}'></script>
     <!-- End Cloudflare Web Analytics -->
</body>
