<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monty Jack</title>

    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/homepage.css">
</head>

<body>
    <header class="site-header">
    <a class="site-logo" href="/" aria-label="Monty Jack">
        <img src="assets/site/montyjack.png" alt="Monty Jack">
    </a>

    <nav class="site-nav" aria-label="Main navigation">
        <a href="/" aria-label="Home" aria-current="page">
            <img src="assets/site/home.png" alt="Home">
        </a>

        <a href="/gallery/" aria-label="Gallery">
            <img src="assets/site/gallery.png" alt="Gallery">
        </a>

        <a href="/shop/" aria-label="Shop">
            <img src="assets/site/shop.png" alt="Shop">
        </a>

        <a href="/#contact/" aria-label="Contact">
            <img src="assets/site/contact.png" alt="Contact">
        </a>
    </nav>
</header>

    <main class="home-page">
        <!-- Selected artwork display -->
        <section class="selected-piece">
            <img src="/assets/gallery/Egg/1.webp" alt="DESCRIBE WHATEVER ARTPIECE HERE">
        </section>

        <!-- About me section with portrait display -->
        <section class="about-me">
            <div class="about-me-image">
                <img src="/assets/homepage/spaghetti.JPEG" alt="Monty Jack eating spaghetti">
            </div>

            <div class="about-me-text">
                <h1>Monty Jack</h1>

                <p>Text here</p>
                
                <p>Text here</p>
            </div>
        </section>

        <!-- Current venues section -->
        <section class="current-venues">
            <h2>Current Venues</h2>

            <p>Artprize 2026!</p>
        </section>

        <!-- Contact section -->
        <section class="contact" id="contact">
            <div class="contact-details">
                <h2>Contact</h2>
                <p>
                    email:<br>
                    <a href="mailto:hello@montyjack.com">hello@montyjack.com</a>
                </p>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 Monty Jack</p>

        <nav aria-label="Social media platforms">
            <a href="mailto:hello@montyjack.com">Email</a>
            <a href="https://instagram.com">Instagram</a>
        </nav>
    </footer>

    <!-- TEMP DEV POPUP -->
<div
    class="development-popup"
    id="development-popup"
    role="dialog"
    aria-modal="true"
    aria-labelledby="development-popup-title"
>
    <div class="development-popup-content">

        <button
            class="development-popup-close"
            id="development-popup-close"
            type="button"
            aria-label="Close development notice"
        >
            &times;
        </button>

        <h2 id="development-popup-title">
            Site Under Development
        </h2>

        <p>
            This website is currently under development.
            Some pages, artwork, and shop features
            may be incomplete or unavailable.
        </p>

        <button
            class="development-popup-continue"
            id="development-popup-continue"
            type="button"
        >
            Continue
        </button>

    </div>
</div>
    
    <script src="js/site.js"></script>
</body>
