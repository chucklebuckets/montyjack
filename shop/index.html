<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | Monty Jack</title>

    <link rel="stylesheet" href="../css/site.css">
    <link rel="stylesheet" href="../css/shop.css">

     <meta
        name="description"
        content="Shop available original artwork and prints by Monty Jack."
    >

    <meta property="og:title" content="Shop | Monty Jack">
    <meta
        property="og:description"
        content="Shop available original artwork and prints by Monty Jack."
    >   
    <meta property="og:image" content="https://montyjack.com/assets/site/shop-preview.jpg">
    <meta property="og:url" content="https://montyjack.com/shop/">
    <meta property="og:type" content="website">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Monty Jack",
        "url": "https://montyjack.com/",
        "sameAs": [
            "https://www.instagram.com/monty_jack0/"
        ],
        "jobTitle": "Artist",
        "image": "https://montyjack.com/assets/homepage/spaghetti.JPEG"
    }
    </script>

    <script src="../js/site.js" defer></script>
    <script src="../js/pieces.js" defer></script>
    <script src="../js/products.js" defer></script>
    <script src="../js/shop-utils.js" defer></script>
    <script src="../js/shop.js" defer></script>
</head>

<body>
    <header class="site-header">

    <a class="site-logo" href="/" aria-label="Monty Jack">
        <img src="/assets/site/montyjack.png" alt="Monty Jack">
    </a>


    <!-- Desktop navigation -->
    <nav class="site-nav" aria-label="Main navigation">

        <a href="/" aria-label="Home">
            <img src="/assets/site/home.png" alt="">
        </a>

        <a href="/gallery/" aria-label="Gallery">
            <img src="/assets/site/gallery.png" alt="">
        </a>

        <a
            href="/shop/"
            aria-label="Shop"
            aria-current="page"
        >
            <img src="/assets/site/shop.png" alt="">
        </a>

        <a href="/#contact" aria-label="Contact">
            <img src="/assets/site/contact.png" alt="">
        </a>

    </nav>


    <!-- Hamburger -->
    <button
        class="site-menu-toggle"
        id="site-menu-toggle"
        type="button"
        aria-label="Open navigation"
        aria-controls="site-menu"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

</header>


<!-- Collapsed navigation -->
<dialog
    class="site-menu"
    id="site-menu"
>
    <button
        class="site-menu-close"
        id="site-menu-close"
        type="button"
        aria-label="Close navigation"
    >
        &times;
    </button>


    <div class="site-menu-content">

        <nav
            class="site-menu-nav"
            aria-label="Collapsed navigation"
        >
            <a href="/" aria-label="Home">
                <img src="/assets/site/home.png" alt="">
            </a>

            <a href="/gallery/" aria-label="Gallery">
                <img src="/assets/site/gallery.png" alt="">
            </a>

            <a
                href="/shop/"
                aria-label="Shop"
                aria-current="page"
            >
                <img src="/assets/site/shop.png" alt="">
            </a>

            <a href="/#contact" aria-label="Contact">
                <img src="/assets/site/contact.png" alt="">
            </a>
        </nav>


        <div class="site-menu-socials">

            <a
                href="https://www.instagram.com/monty_jack0/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
            >
                <img
                    src="/assets/site/instagram.png"
                    alt=""
                >
            </a>

            <a
                href="mailto:hello@montyjack.com"
                aria-label="Email"
            >
                <img
                    src="/assets/site/email.png"
                    alt=""
                >
            </a>

        </div>

    </div>
</dialog>


    

    <main>
        <section class="shop-page">
            <header class="shop-header">

                <!-- NOTICE -->
                <div class="shop-notice">
                <h1>*Shop is unavailable while website is under development. Coming soon!</h1>
            </div>



                <div class="shop-toolbar">
                    <div class="shop-filters" aria-label="Filter shop products">
                        <button
                            class="shop-filter-button active"
                            data-filter="all"
                            aria-pressed="true"
                        >
                            All
                        </button>

                        <button
                            class="shop-filter-button"
                            data-filter="original"
                            aria-pressed="false"
                        >
                            Originals
                        </button>

                        <button
                            class="shop-filter-button"
                            data-filter="print"
                            aria-pressed="false"
                        >
                            Prints
                        </button>

                        <button
                            class="shop-filter-button"
                            data-filter="other"
                            aria-pressed="false"
                        >
                            Other
                        </button>
                    </div>

                    <label class="availability-control">
                        <input
                            id="availability-filter"
                            type="checkbox"
                        >

                        <span>Available only</span>
                    </label>
                </div>

                <div class="shop-status-row">
                    <span
                        class="shop-count"
                        id="shop-count"
                        aria-live="polite"
                    ></span>
                </div>
            </header>

            <div
                class="shop-grid"
                id="shop-grid"
            ></div>

            <div
                class="shop-empty"
                id="shop-empty"
                hidden
            >
                <p>No products match these filters.</p>
            </div>
        </section>
    </main>

    <!-- TEMP DEV POPUP -->
<div
    class="development-popup"
    id="development-popup"
    role="dialog"
    aria-modal="true"
    aria-labelledby="development-popup-title"
>
    <div class="development-popup-content">

        <button
            class="development-popup-close"
            id="development-popup-close"
            type="button"
            aria-label="Close development notice"
        >
            &times;
        </button>

        <h2 id="development-popup-title">
            Site Under Development
        </h2>

        <p>
            This website is currently under development.
            Some pages, artwork information, and shop features
            may be incomplete or unavailable.
        </p>

        <button
            class="development-popup-continue"
            id="development-popup-continue"
            type="button"
        >
            Continue
        </button>

    </div>
</div>

    <!-- Footer -->
    <footer class="site-footer">
        <img class="site-footer-art" src="/assets/site/footer.png" alt="">

        <div class="site-footer-content">
            <nav class="site-footer-socials" aria-label="Social media platforms">
                <a
                    href="https://www.instagram.com/monty_jack0/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                >
                    <img src="/assets/site/instagram-filled.png" alt="">
                </a>

                <a href="mailto:hello@montyjack.com" aria-label="Email">
                    <img src="/assets/site/email-filled.png" alt="">
                </a>              
            </nav>

            <p>&copy; 2026 Monty Jack</p>
        </div>
    </footer>

    <!-- Cloudflare Web Analytics -->
     <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a90dfcdf83304e1a97027aba6ba4aad4"}'></script>
     <!-- End Cloudflare Web Analytics -->
</body>
</html>
