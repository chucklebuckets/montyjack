<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | Monty Jack</title>

    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/product.css">

    <script src="/js/site.js" defer></script>
    <script src="/js/pieces.js" defer></script>
    <script src="/js/products.js" defer></script>
    <script src="/js/shop-utils.js" defer></script>
    <script src="/js/product.js" defer></script>
</head>

<body>
    <header class="site-header">

    <a class="site-logo" href="/" aria-label="Monty Jack">
        <img src="/assets/site/montyjack.png" alt="Monty Jack">
    </a>


    <!-- Desktop navigation -->
    <nav class="site-nav" aria-label="Main navigation">

        <a href="/" aria-label="Home">
            <img src="/assets/site/home.png" alt="">
        </a>

        <a href="/gallery/" aria-label="Gallery">
            <img src="/assets/site/gallery.png" alt="">
        </a>

        <a
            href="/shop/"
            aria-label="Shop"
            aria-current="page"
        >
            <img src="/assets/site/shop.png" alt="">
        </a>

        <a href="/#contact" aria-label="Contact">
            <img src="/assets/site/contact.png" alt="">
        </a>

    </nav>


    <!-- Hamburger -->
    <button
        class="site-menu-toggle"
        id="site-menu-toggle"
        type="button"
        aria-label="Open navigation"
        aria-controls="site-menu"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

</header>


<!-- Collapsed navigation -->
<dialog
    class="site-menu"
    id="site-menu"
>
    <button
        class="site-menu-close"
        id="site-menu-close"
        type="button"
        aria-label="Close navigation"
    >
        &times;
    </button>


    <div class="site-menu-content">

        <nav
            class="site-menu-nav"
            aria-label="Collapsed navigation"
        >
            <a href="/" aria-label="Home">
                <img src="/assets/site/home.png" alt="">
            </a>

            <a href="/gallery/" aria-label="Gallery">
                <img src="/assets/site/gallery.png" alt="">
            </a>

            <a
                href="/shop/"
                aria-label="Shop"
                aria-current="page"
            >
                <img src="/assets/site/shop.png" alt="">
            </a>

            <a href="/#contact" aria-label="Contact">
                <img src="/assets/site/contact.png" alt="">
            </a>
        </nav>


        <div class="site-menu-socials">

            <a
                href="https://www.instagram.com/monty_jack0/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
            >
                <img
                    src="/assets/site/instagram.png"
                    alt=""
                >
            </a>

            <a
                href="mailto:hello@montyjack.com"
                aria-label="Email"
            >
                <img
                    src="/assets/site/email.png"
                    alt=""
                >
            </a>

        </div>

    </div>
</dialog>

    <main class="product-page">

        <!-- NOTICE -->
                <div class="shop-notice">
                <h1>*Shop is unavailable while website is under development. Coming soon!</h1>
            </div>


        <nav class="product-breadcrumb" aria-label="Breadcrumb">
            <a href="../index.html">Shop</a>
            <span aria-hidden="true">›</span>
            <span
                class="product-breadcrumb-title"
                id="product-breadcrumb-title"
            >
                Product
            </span>
        </nav>

        <section
            class="product-layout"
            id="product-layout"
            hidden
        >
            <div class="product-media">
                <div class="product-image-stage">
                    <button
                        class="product-image-nav product-image-previous"
                        id="product-image-previous"
                        type="button"
                        aria-label="Previous product image"
                        hidden
                    >
                        &#10094;
                    </button>

                    <img
                        class="product-main-image zoomable-artwork"
                        id="product-main-image"
                        src=""
                        alt=""
                    >

                    <div
                        class="product-image-error"
                        id="product-image-error"
                        role="status"
                        hidden
                    ></div>

                    <button
                        class="product-image-nav product-image-next"
                        id="product-image-next"
                        type="button"
                        aria-label="Next product image"
                        hidden
                    >
                        &#10095;
                    </button>
                </div>

                <span
                    class="product-image-index"
                    id="product-image-index"
                    aria-live="polite"
                    hidden
                ></span>

                <div
                    class="product-thumbnails"
                    id="product-thumbnails"
                    aria-label="Product images"
                    hidden
                ></div>
            </div>

            <div class="product-info">
                <h1
                    class="product-title"
                    id="product-title"
                ></h1>

                <p
                    class="product-type"
                    id="product-type"
                ></p>

                <p
                    class="product-price"
                    id="product-price"
                ></p>

                <p
                    class="product-availability"
                    id="product-availability"
                ></p>

                <div class="product-details-list">
                    <p
                        class="product-detail-item product-shipping-notes"
                        id="product-shipping-notes"
                        hidden
                    ></p>

                    <p
                        class="product-detail-item"
                        id="product-dimensions-row"
                        hidden
                    >
                        <span id="product-dimensions"></span>
                    </p>

                    <p
                        class="product-detail-item"
                        id="product-materials-row"
                        hidden
                    >
                        <span id="product-materials"></span>
                    </p>

                    <p
                        class="product-detail-item product-packaging"
                        id="product-packaging"
                        hidden
                    ></p>

                    <p
                        class="product-detail-item product-framing"
                        id="product-framing"
                        hidden
                    ></p>

                    <p
                        class="product-detail-item product-shipping-price"
                        id="product-shipping-price"
                        hidden
                    ></p>
                </div>

                <div class="product-checkout">
                    <p
                        class="product-variant-note"
                        id="product-variant-note"
                        hidden
                    ></p>

                    <a
                        class="product-purchase disabled"
                        id="product-purchase"
                        aria-disabled="true"
                    >
                        Purchase link coming soon
                    </a>

                    <p
                        class="product-checkout-note"
                        id="product-checkout-note"
                    ></p>
                </div>

                <div class="product-actions">
                    <a
                        id="product-gallery-link"
                        href=""
                        hidden
                    >
                        View in Gallery
                    </a>

                    <button
                        class="product-copy-link"
                        id="product-copy-link"
                        type="button"
                    >
                        Copy Link
                    </button>
                </div>
            </div>
        </section>

        <section
            class="product-missing"
            id="product-missing"
            hidden
        >
            <h1>Product not found</h1>

            <p>
                This product may no longer be listed.
            </p>

            <a href="../index.html">Return to Shop</a>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <img class="site-footer-art" src="/assets/site/footer.png" alt="">

        <div class="site-footer-content">
            <nav class="site-footer-socials" aria-label="Social media platforms">
                <a
                    href="https://www.instagram.com/monty_jack0/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                >
                    <img src="/assets/site/instagram-filled.png" alt="">
                </a>

                <a href="mailto:hello@montyjack.com" aria-label="Email">
                    <img src="/assets/site/email-filled.png" alt="">
                </a>              
            </nav>

            <p>&copy; 2026 Monty Jack</p>
        </div>
    </footer>

    <!-- Cloudflare Web Analytics -->
     <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a90dfcdf83304e1a97027aba6ba4aad4"}'></script>
     <!-- End Cloudflare Web Analytics -->
</body>
</html>
